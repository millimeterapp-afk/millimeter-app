name: Supabase Keepalive

# Sprečava pauziranje Supabase Free tier projekta (pauzira nakon 7 dana neaktivnosti).
# Kuca tabelu public.keepalive koju anon SME da čita (jedina takva) — vraća 200 i
# računa se kao aktivnost. VAŽNO: raniji ping na 'companies' vraćao je 401 (anon je
# REVOKE-ovan), Supabase to NE broji kao aktivnost, a workflow je ipak bio zelen —
# zato se projekat pauzirao uprkos "uspešnom" keepalive-u. Sad tražimo tačno 200.

on:
  schedule:
    - cron: "0 6,18 * * *" # dvaput dnevno (06:00 i 18:00 UTC) — margina ako GitHub preskoči run
  workflow_dispatch: {} # omogućava ručno pokretanje iz GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://zbmjhmvpavojahhnrkzp.supabase.co/rest/v1/keepalive?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "Supabase REST odgovorio: HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "Greska: keepalive nije 200 (dobijeno $CODE) — ping se NE racuna kao aktivnost, projekat moze da se pauzira"
            exit 1
          fi
        env:
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpibWpobXZwYXZvamFoaG5ya3pwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyOTQxOTUsImV4cCI6MjA5NDg3MDE5NX0.RTMeFftFz7bZZ_P86hovnEs8O7K5wPHRyO_ALPd7axs
